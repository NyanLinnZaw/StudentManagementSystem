apiVersion: apps/v1
kind: Deployment

metadata:
  name: student-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: student-backend

  template:
    metadata:
      labels:
        app: student-backend

    spec:
      containers:
        - name: student-backend
          image: student_management_system-app:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8082

          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/student_management

            - name: SPRING_DATASOURCE_USERNAME
              value: root

            - name: SPRING_DATASOURCE_PASSWORD
              value: root